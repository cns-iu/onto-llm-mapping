mapping_set_title: "Medical Subject Heading mappings to UBERON and Cell Ontology, for human anatomical entities."
mapping_set_description: "This set of SSSOM mappings links semantic entities from Medical Subject Heading (MeSH) RDF taxonomy to those from UBERON and Cell Ontologies. The purpose of this mapping is to support the identification of research publications associated with human anatomy by linking subject heading entities with the semantic entities that they represent (i.e., anatomical and cell entities) for use in the Human Reference Atlas project.  These mappings were created using 1) SSSOM mapping sets identified by the comparison of concept definitions generated by humans and four large language models, and 2) a SSSOM mapping set generated by subject matter experts at  European Molecular Biology Laboratory (EBI) that maps Open Biological and Biomedical Ontology (OBO) and MeSH entities, which was used in the review and validation process."
